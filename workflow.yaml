# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
---
# ==============================================================================
# Hello World Batch Submitter
# ==============================================================================
# A simple example workflow demonstrating how to submit batch jobs using the
# job_runner/v4.0 marketplace action. This workflow accepts a series of
# commands, packages them into a script, and submits via the reusable
# job_runner.
#
# This pattern leverages marketplace/job_runner/v4.0 for:
#   - Scheduler support (SLURM/PBS)
#   - Job monitoring and output streaming
#   - Automatic cancellation handling
#
# Usage:
#   1. Select a compute resource
#   2. Enter commands to execute (one per line)
#   3. Choose execution mode (SSH direct or scheduler)
#   4. Run the workflow
#
# For more information, see README.md
# ==============================================================================

jobs:
  # ============================================================================
  # PREPROCESSING - Create the command script on the remote system
  # ============================================================================
  preprocessing:
    working-directory: "${PW_PARENT_JOB_DIR}"
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Create working directory
        run: |
          set -e
          mkdir -p "${PW_PARENT_JOB_DIR}"
          echo "$(date) Working directory: ${PW_PARENT_JOB_DIR}"

      - name: Create command script
        run: |
          set -e
          echo "$(date) Creating command script..."

          # Create the main execution script with header
          cat > commands.sh << 'HEADER_EOF'
          #!/bin/bash
          set -e

          echo "=============================================="
          echo "  Hello World from Parallel Works ACTIVATE"
          echo "=============================================="
          echo ""
          echo "System Information:"
          echo "  Hostname:    $(hostname)"
          echo "  Date:        $(date)"
          echo "  User:        $(whoami)"
          echo "  Directory:   $(pwd)"
          echo "  Job ID:      ${PW_JOB_ID:-N/A}"
          echo ""
          echo "----------------------------------------------"
          echo "  Executing Commands"
          echo "----------------------------------------------"
          echo ""
          HEADER_EOF

          # Append user commands to the script
          cat >> commands.sh << 'USER_COMMANDS_EOF'
          ${{ inputs.commands }}
          USER_COMMANDS_EOF

          # Add completion footer
          cat >> commands.sh << 'FOOTER_EOF'

          echo ""
          echo "----------------------------------------------"
          echo "  All commands completed"
          echo "----------------------------------------------"
          echo ""
          echo "Finished at: $(date)"
          echo "=============================================="
          FOOTER_EOF

          chmod +x commands.sh

          echo "$(date) Script created successfully:"
          echo "--- commands.sh ---"
          cat commands.sh
          echo "--- end of script ---"

  # ============================================================================
  # JOB RUNNER - Submit via v4.0 marketplace action
  # ============================================================================
  job_runner:
    needs: [preprocessing]
    working-directory: "${PW_PARENT_JOB_DIR}"
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Submit batch job
        early-cancel: any-job-failed
        uses: marketplace/job_runner/v4.0
        with:
          resource: ${{ inputs.resource }}
          rundir: "${PW_PARENT_JOB_DIR}"
          scheduler: ${{ inputs.submit_to_scheduler }}
          use_existing_script: true
          script_path: "${PW_PARENT_JOB_DIR}/commands.sh"
          slurm:
            is_disabled: ${{ inputs.slurm.is_disabled }}
            account: ${{ inputs.slurm.account }}
            partition: ${{ inputs.slurm.partition }}
            qos: ${{ inputs.slurm.qos }}
            time: ${{ inputs.slurm.time }}
            cpus_per_task: ${{ inputs.slurm.cpus_per_task }}
            gres: ${{ inputs.slurm.gres }}
            scheduler_directives: |
              ${{ inputs.slurm.scheduler_directives }}
          pbs:
            is_disabled: ${{ inputs.pbs.is_disabled }}
            account: ${{ inputs.pbs.account }}
            queue: ${{ inputs.pbs.queue }}
            walltime: ${{ inputs.pbs.walltime }}
            select: ${{ inputs.pbs.select }}
            scheduler_directives: |
              ${{ inputs.pbs.scheduler_directives }}

      - name: Show job output
        run: |
          echo "=============================================="
          echo "  Job Output"
          echo "=============================================="
          OUTPUT_FILE="run.${PW_JOB_ID}.out"
          if [ -f "${OUTPUT_FILE}" ]; then
            cat "${OUTPUT_FILE}"
          else
            echo "Output file not found: ${OUTPUT_FILE}"
            echo "Files in directory:"
            ls -la
          fi

      - name: Notify job ended
        early-cancel: any-job-failed
        run: touch job.ended

# ==============================================================================
# INPUT DEFINITIONS
# ==============================================================================
"on":
  execute:
    inputs:
      # ========================================================================
      # Core Settings
      # ========================================================================
      resource:
        label: Compute Resource
        type: compute-clusters
        autoselect: true
        optional: false
        tooltip: Select the compute resource where the job will run

      # ========================================================================
      # Commands Configuration
      # ========================================================================
      commands:
        label: Commands to Execute
        type: editor
        optional: false
        default: |
          # Enter your commands below (one per line)
          # These will be packaged into a script and executed on the remote system

          hostname
          date
          whoami
          pwd
          uname -a

          echo "Environment variables:"
          env | sort | head -20
        tooltip: |
          Enter the commands you want to execute on the remote system.
          Each line will be executed in sequence.

          Example commands:
            hostname          - Display the compute node name
            date              - Show current date/time
            module avail      - List available modules
            nvidia-smi        - Show GPU status (if available)

      # ========================================================================
      # Execution Mode
      # ========================================================================
      submit_to_scheduler:
        type: boolean
        label: Submit to Job Scheduler
        tooltip: Enable to submit job via SLURM or PBS scheduler (detected automatically from resource). Disable for direct SSH execution.
        default: false
        hidden: ${{ inputs.resource.schedulerType != 'slurm' && inputs.resource.schedulerType != 'pbs' }}

      # ========================================================================
      # SLURM Configuration
      # ========================================================================
      slurm:
        type: group
        label: SLURM Configuration
        hidden: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}
        collapsed: true
        items:
          is_disabled:
            type: boolean
            default: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}
            hidden: true

          account:
            label: Account
            type: slurm-accounts
            resource: ${{ inputs.resource }}
            tooltip: SLURM account for job submission (--account)
            optional: true
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}

          partition:
            type: slurm-partitions
            label: Partition
            optional: true
            resource: ${{ inputs.resource }}
            tooltip: Partition for job submission (--partition)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}

          qos:
            label: Quality of Service (QoS)
            type: slurm-qos
            resource: ${{ inputs.resource }}
            tooltip: SLURM QoS setting (--qos)
            optional: true
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}

          cpus_per_task:
            type: number
            label: CPUs per Task
            min: 1
            max: 256
            default: 1
            tooltip: Number of CPUs for the job (--cpus-per-task)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}

          time:
            label: Walltime
            type: string
            default: "00:30:00"
            tooltip: Maximum job duration, e.g., 00:30:00 (--time)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}

          gres:
            label: GPUs (gres)
            type: dropdown
            default: ""
            optional: true
            tooltip: GPU resource specification (--gres). Leave empty for CPU-only jobs.
            options:
              - value: ""
                label: "No GPU (CPU only)"
              - value: "gpu:1"
                label: "1 GPU (gpu:1)"
              - value: "gpu:2"
                label: "2 GPUs (gpu:2)"
              - value: "gpu:4"
                label: "4 GPUs (gpu:4)"
              - value: "gpu:8"
                label: "8 GPUs (gpu:8)"
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}

          scheduler_directives:
            type: editor
            label: Additional Directives
            optional: true
            tooltip: Additional SLURM directives (include #SBATCH prefix)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'slurm' }}

      # ========================================================================
      # PBS Configuration
      # ========================================================================
      pbs:
        type: group
        label: PBS Configuration
        hidden: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'pbs' }}
        collapsed: true
        items:
          is_disabled:
            type: boolean
            default: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'pbs' }}
            hidden: true

          account:
            label: Account
            type: string
            optional: true
            tooltip: PBS account for job submission (-A)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'pbs' }}

          queue:
            label: Queue
            type: string
            optional: true
            tooltip: PBS queue name (-q)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'pbs' }}

          walltime:
            label: Walltime
            type: string
            default: "00:30:00"
            tooltip: Maximum job duration, e.g., 00:30:00 (-l walltime=)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'pbs' }}

          select:
            label: Resource Selection
            type: string
            default: "1:ncpus=1"
            placeholder: "1:ncpus=1"
            tooltip: PBS resource selection string, e.g., 1:ncpus=1 (-l select=)
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'pbs' }}

          scheduler_directives:
            label: Additional Directives
            type: editor
            tooltip: Additional PBS directives (include #PBS prefix)
            optional: true
            ignore: ${{ inputs.submit_to_scheduler != true || inputs.resource.schedulerType != 'pbs' }}
